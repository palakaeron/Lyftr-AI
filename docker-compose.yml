version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lyftr-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: "sqlite:////data/app.db"
      CACHE_DIR: "/data/litellm_cache"
    volumes:
      - chatdata:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: "${REACT_APP_API_URL:-http://localhost:8000}"
    container_name: lyftr-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  chatdata:
    driver: local
